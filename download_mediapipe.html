<!DOCTYPE html>
<html>
<head>
    <title>Mediapipe Download Helper</title>
</head>
<body>
    <h1>Mediapipeファイルをダウンロード中...</h1>
    <div id="log"></div>
    <script>
        const files = [
            { url: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.164/hands.js', name: 'hands.js' },
            { url: 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4.164/camera_utils.js', name: 'camera_utils.js' },
            { url: 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4.164/drawing_utils.js', name: 'drawing_utils.js' }
        ];
        
        async function download() {
            for (const file of files) {
                try {
                    const response = await fetch(file.url);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    document.getElementById('log').innerHTML += `<div>✓ ${file.name} をダウンロードしました</div>`;
                } catch(e) {
                    document.getElementById('log').innerHTML += `<div>✗ ${file.name} のダウンロード失敗: ${e}</div>`;
                }
            }
        }
        window.onload = download;
    </script>
</body>
</html>
