<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Camera Diagnostic</title>
  <style>
    body{font-family:system-ui,Segoe UI,Segoe,Arial;
         background:#fff;
         color:#111;
         padding:12px;
        }
    #log{
      white-space:pre-wrap;
      background:#f7f7f7;
      border:1px solid #ddd;
      padding:8px;
      height:160px;
      overflow:auto
    }
  </style>
</head>
<body>
  <h2>Camera Diagnostic</h2>
  <div>スマホでこのページを開いてください（HTTPS推奨／GitHub Pages推奨）</div>
  <div style="margin-top:8px">
    <label>利用可能なビデオ入力: <select id="videoSelect"></select></label>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>
  <div style="margin-top:8px">
    <video id="v" autoplay playsinline muted style="width:320px;height:240px;background:#000"></video>
  </div>
  <h4>ログ</h4>
  <div id="log">—</div>

<script>
const L = msg=>{ try{ console.log(msg); const d=document.getElementById('log'); d.textContent = (d.textContent==='—'?'':d.textContent+'\n') + msg; }catch(e){} };
window.addEventListener('error', e=>{ L('window.error: '+(e && e.message)); });
window.addEventListener('unhandledrejection', e=>{ L('unhandledrejection: '+(e && e.reason && e.reason.message ? e.reason.message : String(e.reason))); });
async function enumerateDevices(){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const sel = document.getElementById('videoSelect'); sel.innerHTML='';
    devices.filter(d=>d.kind==='videoinput').forEach(d=>{
      const opt = document.createElement('option'); opt.value = d.deviceId; opt.textContent = d.label || `camera ${sel.length+1}`; sel.appendChild(opt);
    });
    L('devices listed: ' + sel.length);
  }catch(e){ L('enumerateDevices error: '+e); }
}

let stream = null;
async function start(){
  L('Start clicked');
  const sel = document.getElementById('videoSelect');
  const deviceId = sel.value || undefined;
  const constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' } };
  L('getUserMedia constraints: ' + JSON.stringify(constraints));
  let attempted = 0;
  const tryGet = async (c)=>{
    attempted++;
    L('attempt #' + attempted + ' with ' + JSON.stringify(c));
    try{
      stream = await navigator.mediaDevices.getUserMedia(c);
      document.getElementById('v').srcObject = stream;
      L('stream started');
      const tracks = stream.getVideoTracks(); L('tracks: '+tracks.length+'; label: '+(tracks[0] && tracks[0].label));
      return true;
    }catch(err){
      L('getUserMedia error: ' + err.name + ' — ' + err.message);
      return err;
    }
  };
  const primary = await tryGet(constraints);
  if (primary !== true) {
    const fb1 = await tryGet({video:true});
    if (fb1 !== true) {
      await tryGet({video:{width:{ideal:1280},height:{ideal:720},facingMode:'environment'}});
    }
  }
  setTimeout(()=>{ if (!stream) L('timeout: no stream after 5s'); }, 5000);
}
function stop(){ if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; document.getElementById('v').srcObject=null; L('stream stopped'); } }

document.getElementById('start').addEventListener('click', start);
document.getElementById('stop').addEventListener('click', stop);

// 初期化: まず権限を促してデバイスを列挙
(async ()=>{
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ L('navigator.mediaDevices not available'); return; }
  try{
    // 一度取得してから enumerateDevices するとラベルが表示される
    const s = await navigator.mediaDevices.getUserMedia({video:true});
    s.getTracks().forEach(t=>t.stop());
  }catch(e){ L('初回 getUserMedia での確認: ' + e.name + ' — ' + e.message); }
  await enumerateDevices();
})();
</script>
</body>
</html>
