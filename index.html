<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#2196F3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="スマホタイピング">
    <title>スマホタイピング</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232196F3' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>タ</text></svg>">
    <link rel="stylesheet" href="st_main.css">
    <!-- wanakana -->
    <script src="https://unpkg.com/wanakana@4.0.2/wanakana.min.js"></script>
    <!-- Mediapipe - Local files -->
    <script src="https://ishikawa1007.github.io/st_202601/hands/hands.js"></script>
    <script src="https://ishikawa1007.github.io/st_202601/camera/camera_utils.js"></script>
    <script src="https://ishikawa1007.github.io/st_202601/draw/drawing_utils.js"></script>
</head>
<body>
    <div id="page1" class="page" style="display:flex;">
        <header>
            <h1 class="title">スマホタイピング</h1>
        </header>
        <button type="button" class="stbutton">
            あそぶ
        </button>
    </div>
    <div id="page2" class="page" style="display:none;">
        <header>
            <h3 class="title">モード</h3>
        </header>
        <div class="sliderRow">
            <span class="sliderLabel">じかん</span>
            <input type="range" class="tslider" min="1" max="5" value="3">
            <p id="tsliderLabel" class="tsliderText">3ふん</p>
        </div>
        <div class="sliderRow">
            <span class="sliderLabel">ことば</span>
            <input type="range" class="lslider" min="1" max="5" value="3">
            <p id="lsliderLabel" class="lsliderText">ながいことば</p>
        </div>
        
        <div class="buttonRow">
            <button type="button" class="backbutton_a">
                もどる
            </button>
            <button type="button" class="prepbutton">
                じゅんび
            </button>
        </div>
    </div>
    <div id="page3" class="page" style="display:none;">
        <!--確認画面-->
        <header>
            <h2 class="title">カメラをかくにんしよう</h2>
        </header>
        <!--指が反応しているか、キーが対応して動くか確認(MPにて)**-->
        <div style="display:flex; flex-direction:column; align-items:center; gap:0.5rem; margin-top:0.5rem;">
            <!-- デバッグ用: video を表示 -->
            <video id="mp_input_video_p3" class="mp_input_video_p3" style="width:200px;height:150px;background:#000;border:1px solid #aaa;" autoplay muted playsinline></video>
            <canvas id="mp_output_canvas_p3" class="mp_output_canvas_p3 mp_canvas_half" width="640" height="240" style="border:1px solid #ccc; background:#000;"></canvas>
        </div>
        <button type="button" class="backbutton_b">
            もどる
        </button>
        <button type="button" class="pracbutton">
            OK!
        </button>
    </div>
    <div id="page4" class="page" style="display:none;">
        <!--ゲーム開始-->
        
        <div class="wordDisplay" style="text-align:center; margin:0;">
            <p id="wordLabel" class="wordLabel" style="font-size:2rem; margin:0;"></p>
            <p id="romajiLabel" class="romajiLabel" style="font-size:1.2rem; color:#666; margin:0;"></p>
        </div>
        <div class="timer">
        <span id="timerLabel" class="timerLabel"></span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:0.5rem; margin-top:0.5rem;">
            <!-- デバッグ用: video を表示 -->
        <video id="mp_input_video_p4" class="mp_input_video_p4" style="width:200px;height:150px;background:#000;border:1px solid #aaa;" autoplay muted playsinline></video>
        <canvas id="mp_output_canvas_p4" class="mp_output_canvas_p4 mp_canvas_half" width="640" height="240" style="border:1px solid #ccc; background:#000;"></canvas>
            
        </div>
        <div style="display:flex; align-items:center; justify-content:center; gap:1rem;">
            <button type="button" class="stopbutton">
                やめる
            </button>
        </div>
    </div>
    <div id="page5" class="page" style="display:none;">
        <!--結果-->
    <table>
        <tr>
            <th></th>
            <th></th>
        </tr>
        <tr>
            <td>とくてん</td>
            <td id="point"></td>
        </tr>
        <tr>
            <td>ランク</td>
            <td id="rank"></td>
        </tr>
        <tr>
            <td>ことば</td>
            <td id="length"></td>
        </tr>
        <tr>
            <td>じかん</td>
            <td id="time"></td>
        </tr>
        <tr>
            <td>はやさ</td>
            <td id="speed"></td>
        </tr>
        <tr>
            <td>正しくうったかず</td>
            <td id="n_true"></td>
        </tr>
        <tr>
            <td>まちがえたかず</td>
            <td id="n_false"></td>
        </tr>
            <td>正しくうったわりあい</td>
            <td id="t_per"></td>
        </tr>
        <tr>
            <td>まちがえたわりあい</td>
            <td id="f_per"></td>
        </tr>       
    </table>
    <button type="button" class="homebutton">
        ホームへ
    </button>
    </div>
    <script src="st_all.js" defer></script>
    <script>
        // st_all.jsが読み込まれた後、Mediapipeの読み込み開始
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOMContentLoaded: Starting waitForMediapipe');
            const ready = await waitForMediapipe();
            if (!ready) {
                console.error('Failed to load Mediapipe after timeout');
            }
        });
    </script>
    <script>
        // Service Worker登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => console.log('Service Worker登録成功:', registration))
                .catch(error => console.error('Service Worker登録失敗:', error));
        }
    </script>
</body>
</html>
