<!DOCTYPE html>
<html>
<head>
    <title>Mediapipe Setup</title>
    <style>
        body { font-family: system-ui; padding: 20px; max-width: 600px; margin: 0 auto; }
        .log { background: #f5f5f5; border: 1px solid #ddd; padding: 10px; margin: 10px 0; min-height: 200px; font-size: 12px; overflow-y: auto; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Mediapipe ライブラリセットアップ</h1>
    <p>以下のボタンをクリックしてMediapipeライブラリをダウンロードしてください。</p>
    
    <button onclick="downloadAllFiles()">Mediapipeファイルをダウンロード</button>
    
    <div class="log" id="log"></div>
    
    <h3>使用方法：</h3>
    <ol>
        <li>上のボタンをクリックして、3つのファイルをダウンロード</li>
        <li>ダウンロードしたファイルをこのフォルダ（st_202601）に配置</li>
        <li>index.htmlをリロード</li>
    </ol>

    <script>
        const logEl = document.getElementById('log');
        
        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.textContent = `[${time}] ${msg}`;
            div.className = isError ? 'error' : 'success';
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        const files = [
            {
                url: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.164/hands.js',
                backup: 'https://unpkg.com/@mediapipe/hands@0.4.164/hands.js',
                name: 'hands.js'
            },
            {
                url: 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4.164/camera_utils.js',
                backup: 'https://unpkg.com/@mediapipe/camera_utils@0.4.164/camera_utils.js',
                name: 'camera_utils.js'
            },
            {
                url: 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4.164/drawing_utils.js',
                backup: 'https://unpkg.com/@mediapipe/drawing_utils@0.4.164/drawing_utils.js',
                name: 'drawing_utils.js'
            }
        ];
        
        async function downloadFile(fileInfo) {
            try {
                log(`${fileInfo.name} をダウンロード中...`);
                let response = await fetch(fileInfo.url);
                
                if (!response.ok) {
                    log(`  ${fileInfo.url} が失敗、バックアップからダウンロード...`);
                    response = await fetch(fileInfo.backup);
                }
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileInfo.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                log(`✓ ${fileInfo.name} をダウンロード完了 (${Math.round(blob.size / 1024)}KB)`);
                return true;
            } catch (e) {
                log(`✗ ${fileInfo.name} ダウンロード失敗: ${e}`, true);
                return false;
            }
        }
        
        async function downloadAllFiles() {
            logEl.innerHTML = '';
            log('Mediapipeライブラリのダウンロードを開始します...');
            
            let successCount = 0;
            for (const fileInfo of files) {
                const success = await downloadFile(fileInfo);
                if (success) successCount++;
                await new Promise(r => setTimeout(r, 500)); // 500ms間隔
            }
            
            log('');
            log(`ダウンロード完了: ${successCount}/${files.length} 成功`);
            log('');
            if (successCount === files.length) {
                log('✓ すべてのファイルのダウンロードが完了しました！', false);
                log('次のステップ:');
                log('1. ダウンロードしたファイルをこのフォルダに移動してください');
                log('2. index.htmlを開き直してください', false);
            } else {
                log('✗ 一部のファイルのダウンロードに失敗しました', true);
                log('インターネット接続を確認してから、もう一度試してください', true);
            }
        }
        
        log('準備完了。ボタンをクリックしてダウンロードを開始してください。');
    </script>
</body>
</html>
